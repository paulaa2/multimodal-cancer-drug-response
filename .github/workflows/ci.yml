name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements/stable-v1-win-py313.lock.txt
      - name: Install frozen Windows environment
        run: python -m pip install --require-hashes -r requirements/stable-v1-win-py313.lock.txt
      - name: Check dependencies and stable acceptance contracts
        run: |
          python -m pip check
          python -m pytest tests/test_stable_v1.py tests/test_chemical_identity.py
      # Full raw-data/CUDA reproduction is certified locally; no private/raw
      # datasets or GPU availability are assumed on a hosted CI runner.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # RDKit/XGBoost support baseline and split tests. One matrix entry also
      # exercises neural graph tests with CPU torch; CUDA training is separate.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,baselines]"

      - name: Install CPU PyTorch for neural regression checks
        if: matrix.python-version == '3.12'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

  config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Checks pipeline structure without training. Actual argparse contracts
      # are exercised by test_configs.py in the main test job.
      - name: Dry-run every experiment config
        run: |
          for config in configs/experiments/*.json; do
            echo "::group::$config"
            python -m mcdrp.experiments.run_experiment "$config" --dry-run
            echo "::endgroup::"
          done
