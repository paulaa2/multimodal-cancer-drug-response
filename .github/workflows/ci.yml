name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The baselines extra brings RDKit and XGBoost, which the fingerprint,
      # scaffold-split, and tree-model tests need. Torch is deliberately left
      # out: the GNN tests skip themselves when it is missing, which keeps CI
      # fast. Run the GNN suite locally or on a GPU runner.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,baselines]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

  config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Catches broken module paths and malformed step arguments without
      # running any training.
      - name: Dry-run every experiment config
        run: |
          for config in configs/experiments/*.json; do
            echo "::group::$config"
            python -m mcdrp.experiments.run_experiment "$config" --dry-run
            echo "::endgroup::"
          done
