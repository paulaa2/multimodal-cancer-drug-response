[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcdrp"
version = "0.1.0"
description = "Multimodal cancer drug-response prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
]

[project.optional-dependencies]
baselines = [
    "xgboost",
    "rdkit",
]
gpu = [
    "torch",
]
embeddings = [
    "torch",
    "transformers",
    "safetensors",
    "tokenizers",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes the suite runnable straight from a clone, without an editable install.
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 96
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Summary dictionaries are written straight to JSON, and json.dump cannot
    # serialize numpy integer scalars. The int() casts around pandas and numpy
    # results are deliberate, not redundant.
    "RUF046",
    # Arrows and multiplication signs in comments and docstrings are intentional.
    "RUF001",
    "RUF003",
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
# The stubs shipped inside the rdkit wheel contain a syntax error that aborts
# the entire run, and a syntax error in a stub cannot be suppressed by a
# per-module override. Ignoring installed third-party stubs altogether keeps
# the check deterministic across machines; combined with ignore_missing_imports
# it means we type-check our own annotations rather than library signatures.
no_site_packages = true
ignore_missing_imports = true
warn_redundant_casts = true
